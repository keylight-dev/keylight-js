name: Release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to npm (tokenless OIDC, idempotent)
        run: |
          if npm publish --access public --provenance 2>publish.err; then
            echo "published"
          elif grep -qiE "cannot publish over|previously published|already exists" publish.err; then
            cat publish.err; echo "already on npm — ok"
          else
            cat publish.err; exit 1
          fi
      - name: Extract changelog notes for this tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {p=1;print;next} p && /^## \[/ {exit} p {print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "warning: no CHANGELOG section for $ver" >&2; fi
      - name: Create GitHub release with changelog notes
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
